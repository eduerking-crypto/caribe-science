name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vulnerability-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run npm audit
        run: |
          cd apps/web
          npm audit --audit-level=high

      - name: Run pip-audit
        run: |
          cd apps/backend
          pip install pip-audit
          pip-audit -r requirements.txt

  lint-and-test:
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Install backend dependencies
        run: cd apps/backend && pip install -r requirements.txt

      - name: Lint frontend
        run: cd apps/web && npm run lint --if-present || true

      - name: Type check frontend
        run: cd apps/web && npm run typecheck --if-present || true

      - name: Build frontend (OpenNext for Cloudflare)
        run: cd apps/web && npx opennextjs-cloudflare build

      - name: Lint backend
        run: |
          cd apps/backend
          pip install ruff
          ruff check app/ || true

      - name: Type check backend
        run: |
          cd apps/backend
          pip install mypy
          mypy app/ --ignore-missing-imports || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker images
        run: |
          echo "Building backend image..."
          docker build -t caribe-science-backend:latest ./apps/backend

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'caribe-science-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
