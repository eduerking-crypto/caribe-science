              - paragraph [ref=f18e176]: We analyzed gene-gene interactions between FTO and IRX3 variants and obesity-related traits in admixed adults from Cartagena. IRX3 moderated FTO effects on body mass index, highlighting the value of interaction models in admixed populations.
