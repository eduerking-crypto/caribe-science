                - strong [ref=f18e141]: "2026"
                - text: · Aug 6, 2026
              - paragraph [ref=f18e142]: Using 16S rRNA sequencing of the airway microbiome and carotid ultrasound in adults from the Cartagena Cohort Study, we found that airway microbial composition, particularly reduced commensal diversity, is associated with subclinical carotid atherosclerosis independently of classical risk factors.
              - paragraph [ref=f18e143]: Este artículo pertenece a la Sección Microbiome & Inflammation.
