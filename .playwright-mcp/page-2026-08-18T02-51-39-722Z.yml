  - main [ref=f17e44]:
    - generic [ref=f17e46]:
      - paragraph [ref=f17e47]: Comité editorial
      - heading "Gustavo José Mora-García" [level=1] [ref=f17e48]
      - paragraph [ref=f17e49]: MD, PhD — Editor en Jefe
      - generic [ref=f17e50]:
        - generic [ref=f17e51]:
          - heading "Biografía profesional" [level=2] [ref=f17e52]
          - generic [ref=f17e53]:
            - paragraph [ref=f17e54]: Médico y Doctor en Medicina Tropical. Profesor Asociado, Jefe del Departamento de Investigación de la Facultad de Medicina y líder del Laboratory of Public Health R&D de la Universidad de Cartagena (Cartagena de Indias, Colombia).
            - paragraph [ref=f17e55]: Su trabajo se centra en la epidemiología de las enfermedades crónicas no transmisibles en poblaciones admixed (ascendencia europea-africana-amerindia) del Caribe colombiano, con énfasis en la intersección entre obesidad, síndrome metabólico, diabetes tipo 2, función pulmonar, aterosclerosis y factores genéticos, nutricionales y del microbioma.
            - paragraph [ref=f17e56]: Es Investigador Principal del Cartagena Cohort Study (CaReS) (NCT05339048), una cohorte prospectiva de 10 años que estudia la fisiopatología compartida entre enfermedad cardiovascular, aterosclerosis subclínica, deterioro de la función pulmonar y EPOC, integrando datos ómicos, dieta, actividad física y ancestría genética.
            - paragraph [ref=f17e57]: Realizó un postdoctorado en International Health en la Johns Hopkins Bloomberg School of Public Health (2018-2019). Es Investigador Junior reconocido por Minciencias (Colombia).
