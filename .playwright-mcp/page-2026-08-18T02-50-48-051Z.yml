  - main [ref=f13e44]:
    - generic [ref=f13e46]:
      - paragraph [ref=f13e47]: Editorial board
      - heading "Gustavo José Mora-García" [level=1] [ref=f13e48]
      - paragraph [ref=f13e49]: MD, PhD — Editor-in-Chief
      - generic [ref=f13e50]:
        - generic [ref=f13e51]:
          - heading "Professional biography" [level=2] [ref=f13e52]
          - generic [ref=f13e53]:
            - paragraph [ref=f13e54]: Physician and PhD in Tropical Medicine. Associate Professor, Head of the Research Department at the Faculty of Medicine and leader of the Laboratory of Public Health R&D at the Universidad de Cartagena (Cartagena de Indias, Colombia).
            - paragraph [ref=f13e55]: His work focuses on the epidemiology of chronic non-communicable diseases in admixed (European-African-Amerindian ancestry) populations of the Colombian Caribbean, emphasizing the intersection of obesity, metabolic syndrome, type 2 diabetes, lung function, atherosclerosis, and genetic, nutritional and microbiome factors.
            - paragraph [ref=f13e56]: He is Principal Investigator of the Cartagena Cohort Study (CaReS) (NCT05339048), a 10-year prospective cohort studying the shared pathophysiology of cardiovascular disease, subclinical atherosclerosis, lung function decline and COPD, integrating omics, diet, physical activity and genetic ancestry.
            - paragraph [ref=f13e57]: He completed a postdoctoral fellowship in International Health at the Johns Hopkins Bloomberg School of Public Health (2018-2019). He is a Junior Researcher recognized by Minciencias (Colombia).
