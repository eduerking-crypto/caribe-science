    - generic [ref=f16e46]:
      - paragraph [ref=f16e47]: Editorial board
      - heading "Gustavo José Mora-García" [level=1] [ref=f16e48]
      - paragraph [ref=f16e49]: MD, PhD — Editor-in-Chief
      - generic [ref=f16e50]:
        - generic [ref=f16e51]:
          - heading "Professional biography" [level=2] [ref=f16e52]
          - generic [ref=f16e53]:
            - paragraph [ref=f16e54]: Physician and PhD in Tropical Medicine. Associate Professor, Head of the Research Department at the Faculty of Medicine and leader of the Laboratory of Public Health R&D at the Universidad de Cartagena (Cartagena de Indias, Colombia).
            - paragraph [ref=f16e55]: His work focuses on the epidemiology of chronic non-communicable diseases in admixed (European-African-Amerindian ancestry) populations of the Colombian Caribbean, emphasizing the intersection of obesity, metabolic syndrome, type 2 diabetes, lung function, atherosclerosis, and genetic, nutritional and microbiome factors.
            - paragraph [ref=f16e56]: He is Principal Investigator of the Cartagena Cohort Study (CaReS) (NCT05339048), a 10-year prospective cohort studying the shared pathophysiology of cardiovascular disease, subclinical atherosclerosis, lung function decline and COPD, integrating omics, diet, physical activity and genetic ancestry.
            - paragraph [ref=f16e57]: He completed a postdoctoral fellowship in International Health at the Johns Hopkins Bloomberg School of Public Health (2018-2019). He is a Junior Researcher recognized by Minciencias (Colombia).
