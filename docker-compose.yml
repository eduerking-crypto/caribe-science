# CARIBE SCIENCE — infraestructura opcional (PostgreSQL + Redis + Mailpit)
# Uso: docker compose up -d   |   Sin Docker, el backend funciona con SQLite/memoria/local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caribe
      POSTGRES_PASSWORD: caribe
      POSTGRES_DB: caribe_science
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: